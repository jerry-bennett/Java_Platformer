name: CI - Run Tests

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

env:
  GRADLE_VERSION: '8.5'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-${{ env.GRADLE_VERSION }}-${{ hashFiles('GDX_Platformer/gradle-wrapper.properties') }}

      - name: Build and test
        run: |
          cd GDX_Platformer/core
          chmod +x ../../gradlew
          ./../../gradlew test --tests "*Test"
