name: Java Tests

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Wrapper
        uses: gradle/gradle-wrapper-action@e5d69f4712a038b2c22b0c44f7b176c14284800c

      - name: Run Tests with JUnit 5
        run: |
          ./gradlew :core:test --info
